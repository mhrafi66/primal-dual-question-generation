[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primal-dual-question-generation"
version = "0.2.0"
description = "Restored primal-dual automatic question generation with QA consistency and uncommon-word distillation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46,<4.47",
  "datasets>=2.21,<3",
  "numpy>=1.26,<2",
  "tqdm>=4.66,<5",
  "sacrebleu>=2.4,<3",
  "rouge-score>=0.1.2,<0.2",
]

[project.optional-dependencies]
demo = ["gradio>=5,<6"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
