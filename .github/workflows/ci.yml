name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest
      - name: Compile Python sources
        run: |
          python -m py_compile QuestionAnsweringTraining.py SampleQsGenerationExampleAndBLEUScore.py
          python -m py_compile src/primal_dual_qg/*.py scripts/*.py demo/app.py
      - name: Unit tests
        run: pytest -q tests
